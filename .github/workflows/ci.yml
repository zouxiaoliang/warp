name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package tagged binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a tag in the form vMAJOR.MINOR.PATCH (e.g. v1.0.0).' >&2
            exit 1
          fi

          mkdir -p dist
          go build -trimpath -ldflags "-X main.Version=$version" -o dist/warp .
          if [[ "$GOOS/$GOARCH" == linux/amd64 && "$(dist/warp -v)" != "$version" ]]; then
            echo 'Compiled version does not match the Git tag.' >&2
            exit 1
          fi
          tar -czf "dist/warp-${version}-${GOOS}-${GOARCH}.tar.gz" -C dist warp
      - uses: actions/upload-artifact@v4
        with:
          name: warp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
